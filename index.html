<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="refresh" content="0; url=recovery-app.html">
<link rel="canonical" href="recovery-app.html">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0f">
<title>RecoveryIQ</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:#0a0a0f; color:#f0f0f8;
    font-family:'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .logo{
    font-size:42px; font-weight:700; letter-spacing:-1.4px;
    background:linear-gradient(135deg, #a78bfa, #6c63ff, #60a5fa);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  p{color:rgba(240,240,248,0.6); font-weight:300; margin:10px 0 24px;}
  a{
    display:inline-block; min-height:50px; line-height:50px; padding:0 26px;
    background:linear-gradient(135deg, #6c63ff, #8b5cf6);
    color:#fff; text-decoration:none; font-weight:600; border-radius:16px;
  }
  .spin{
    width:34px; height:34px; margin:0 auto 22px;
    border:3px solid rgba(255,255,255,.12);
    border-top-color:#a78bfa; border-radius:50%;
    animation:spin .85s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div>
    <div class="spin"></div>
    <div class="logo">RecoveryIQ</div>
    <p>Abriendo la app&#8230;</p>
    <a href="recovery-app.html">Abrir RecoveryIQ</a>
  </div>
  <script>location.replace('recovery-app.html');</script>
</body>
</html>
